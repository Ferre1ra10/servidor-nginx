<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Suporte</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }


        header {
            background-color: #457b9d;
            color: white;
            text-align: center;
            padding: 40px;
        }


        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }


        section {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }


        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #457b9d;
            color: white;
        }


        footer {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>


<body>


    <header>
        <h1>Suporte</h1>
        <p>Estamos aqui para ajudar</p>
    </header>


    <main>
        <section>
            <h2>Central de Suporte</h2>


            <p>
                Encontre informações e soluções
                para problemas comuns.
            </p>


            <button>Abrir chamado</button>
        </section>
    </main>


    <footer>
        <p>Suporte</p>
    </footer>


</body>


</html>
