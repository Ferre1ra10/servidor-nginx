<!DOCTYPE html>
<html lang="pt-BR">


<head>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Tech</title>


    <style>
        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }


        header {
            background-color: #1d3557;
            color: white;
            text-align: center;
            padding: 40px;
        }


        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }


        section {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
        }


        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #1d3557;
            color: white;
        }


        footer {
            text-align: center;
            padding: 20px;
        }
    </style>


</head>


<body>


    <header>
        <h1>Tech</h1>
        <p>Tecnologia para transformar negócios</p>
    </header>


    <main>


        <section>


            <h2>Bem-vindo à Tech</h2>


            <p>
                Somos uma empresa especializada em soluções
                tecnológicas para empresas.
            </p>


            <button>Conheça nossos serviços</button>


        </section>


    </main>


    <footer>
        <p>Tech © 2026</p>
    </footer>


</body>


</html>
